name: OpenJarvis Web Build

on:
  push:
    branches: [master-branch]
  pull_request:
    branches: [master-branch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with OpenJarvis submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: OpenJarvis/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix OpenJarvis/frontend ci

      - name: Apply web deployment patch
        run: node vercel-build.cjs

      - name: Verify generated frontend
        run: test -f OpenJarvis/frontend/dist/index.html
